name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published continuously; a scan that only runs on change
  # never sees the ones that land after a merge (D-0441, audit 2026-08-05
  # SS19.1). 04:17 UTC daily, off the hour so it does not pile onto the
  # scheduler's busiest minute.
  schedule:
    - cron: "17 4 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Least-privilege default: this workflow only reads and checks the repo, it
# never needs to write anything (no releases, no PR comments, no pushes).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # rust-toolchain.toml pins the channel + components; rustup honours it.
      - name: Show toolchain
        run: rustup show

      # mini-build-runner-wasmtime's adversarial suite (D-0069, Batch 2b.3)
      # compiles real guest fixtures with `rustc --target wasm32-wasip2` at
      # test time; the target isn't part of rust-toolchain.toml's
      # `components` list (that's for rustfmt/clippy, not cross-compile
      # targets) so it needs its own explicit install step here.
      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --all-features

  # Dependency-vulnerability scanning (roadmap #73, D-0441).
  #
  # History, because the shape of this job is a direct response to it: it used
  # to run `rustsec/audit-check` with `continue-on-error: true`. That action
  # runs `cargo install cargo-audit` *inside the checked-out repository*, where
  # `rust-toolchain.toml` pins the channel -- so the install resolved against
  # this repo's pin rather than a decoupled prebuilt binary, and cargo-audit's
  # own dependencies need a newer rustc than the pin provides. The step failed
  # outright, and `continue-on-error` reported that hard failure as a passing
  # check (D-0341 documented this; it is now fixed rather than documented).
  #
  # A green check that means "the scanner never started" is worse than no check
  # at all, because it manufactures confidence instead of merely lacking it.
  #
  # Two outcomes the old configuration could not tell apart, and this one does:
  #
  #   * the scanner cannot run           -> hard failure, this job gates
  #   * the scanner reports advisories   -> loud warning, does not gate yet
  #
  # The second stays non-blocking because this workspace still has no triage
  # process for an advisory against a pinned dependency it cannot yet move off
  # (D-0341's own reasoning, still true). Making findings fail is the named
  # follow-up in D-0441, and needs that process first -- not a config flip.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, which is the whole
      # point: the scanner is a tool *about* this repository, not a build of
      # it, so it must not be constrained by the toolchain this repository
      # happens to pin for its own compilation.
      - name: Install cargo-audit outside this repository's toolchain pin
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          cargo install cargo-audit --locked

      - name: Scan dependencies for advisories
        run: |
          # `shell:` runs this with `bash -e`, and `set -uo pipefail` does
          # not clear that. Without `+e` the next line aborts the job the
          # instant cargo-audit reports a finding -- which is the opposite
          # of what this job is for. It gates on the *scanner running*, and
          # advisories are reported as warnings (D-0441); a hard failure on
          # a finding is what `dependency-deny` deliberately owns. This
          # silently inverted the job's stated contract until an advisory
          # against wasmtime 46.0.2 made it fire on 2026-08-31.
          set +e
          set -uo pipefail
          # Invoked as the binary rather than as `cargo audit`, so the
          # subcommand lookup cannot drag the pinned toolchain back in.
          cargo-audit audit --json > audit-report.json
          status=$?
          # tools/dependency_scan_gate.py (D-0486, PR #327 finding F-11)
          # owns the actual pass/fail reconciliation: a nonzero exit that
          # still produces parseable-but-wrong-shaped JSON (e.g. a bare
          # `{"error": "database unavailable"}`) must never read as a
          # clean scan just because a JSON parser accepted it -- this is
          # what the previous inline check (parseable => trust a
          # `.get(..., {})`-defaulted zero count) got wrong. Reconciling
          # `status` against the report's own declared schema is exercised
          # by tools/test_dependency_scan_gate.py outside of any real CI
          # run, unlike the heredoc it replaces.
          python3 tools/dependency_scan_gate.py \
            --report-file audit-report.json \
            --exit-status "${status}"

  # License/advisory/source policy for the whole resolved dependency
  # graph (D-0069 dependency-governance requirement, first exercised by
  # mini-build-runner-wasmtime's Wasmtime dependency). Config lives in
  # `deny.toml` at the repo root.
  #
  # D-0341 (Android beta slice 7, issue #203): `cargo-deny` v0.20.2 has now
  # been installed and run for real against this workspace's `Cargo.lock`,
  # closing the "unverified config" gap this job's `continue-on-error`
  # existed for -- `deny.toml`'s every allowance is now a specific,
  # reasoned response to a real finding (see that file's comments), not a
  # guess. This job now actually gates merges.
  dependency-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check

  # Real acceptance tests for the Node Appliance backup/restore scripts
  # (D-0491, PR #327 finding F-16): a passphrase argv leak, an unvalidated
  # tar-extraction path-traversal, and a delete-then-move restore sequence
  # that could lose the operator's only recoverable identity state on an
  # interruption were all real, reachable bugs the previous configuration
  # never had a test to catch. `ubuntu-latest`'s default `runner` user is
  # not root, and `restore.sh` requires it (it writes appliance-owned
  # paths); `test_backup_restore.sh` re-execs itself under `sudo` when not
  # already root, the same way a real operator would run the restore step.
  deploy-backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run backup/restore acceptance tests
        run: bash deploy/backup/test_backup_restore.sh

  # The Windows client's own platform (D-0520).
  #
  # Most of the Windows install engine is deliberately platform-independent
  # and is covered by the `check` job above. Three things are not, and a
  # Linux-only CI would never see them: `mini-windows-vault`'s DPAPI round
  # trip, `WindowsShell` actually running its generated PowerShell, and the
  # egui client and installer linking against the MSVC toolchain at all.
  #
  # This job does not run the whole workspace on Windows. That would double
  # CI time for crates whose behaviour cannot differ by platform, and a
  # slower pipeline gets bypassed. It runs exactly the crates whose behaviour
  # *can*.
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show toolchain
        run: rustup show

      - name: Clippy the Windows-specific crates
        run: >
          cargo clippy --all-targets --all-features
          -p mini-windows-vault -p mini-windows-setup -p mini-setup
          -p mini-selftest -p mini-desktop -- -D warnings

      - name: Test the Windows-specific crates
        run: >
          cargo test --all-features
          -p mini-windows-vault -p mini-windows-setup -p mini-setup
          -p mini-selftest -p mini-desktop

      # The diagnostics suite a user can press a button to run, run here too:
      # a self-test nobody checks will one day report a confident green on a
      # broken build.
      - name: Run the diagnostics suite
        run: cargo run --release -p mini-cli -- selftest

      - name: Build a real Windows release
        shell: pwsh
        run: ./packaging/windows/Build-WindowsRelease.ps1 -OutDir dist/ci

      # Install for real, on real Windows, including the Start Menu entry and
      # the Apps & features registration -- then check the installation
      # against its manifest and remove it again. This is the one place the
      # `.lnk` and `HKCU` code paths actually execute.
      - name: Install, verify, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist/ci/mininet-setup-*.exe)[0].FullName
          & $setup --silent --json
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          & $setup --status --json
          & $setup --verify --json
          if ($LASTEXITCODE -ne 0) { throw 'the installation did not verify' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Mininet.lnk")) {
            throw 'the Start Menu entry was not created'
          }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Mininet'
          if (-not (Test-Path $key)) { throw 'the Apps & features entry was not registered' }
          & $setup --uninstall --json
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          if (Test-Path $key) { throw 'the Apps & features entry survived the uninstall' }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Mininet") {
            throw 'program files survived the uninstall'
          }

  # The Windows packaging pipeline, exercised where there is no Windows
  # toolchain (D-0520).
  #
  # `--host` builds host binaries under their Windows names, so the container
  # format, the manifest, reproducibility, the embedded-payload build, and the
  # whole install/verify/upgrade/rollback/uninstall lifecycle all run on every
  # change rather than only when somebody happens to be on Windows. The
  # `windows-client` job above is what proves the Windows-only halves; this one
  # is what keeps the pipeline itself from rotting between those runs.
  windows-packaging-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The package's build timestamp is the commit's author date, so the
          # reproducibility check below needs real git history, not a shallow
          # checkout with a synthesized one.
          fetch-depth: 0

      - name: Build a package and a self-contained installer
        run: packaging/windows/build-release.sh --host --out dist/ci

      # Packing is reproducible: same input bytes plus same declared build
      # timestamp gives the same container, which is what lets two people
      # compare digests and conclude something. This packs the *same staged
      # files* twice rather than rebuilding them, because bit-identical
      # compiler output is a separate, unfinished guarantee (SPEC-11,
      # reproducibility.yml) and folding it in here would make this check
      # flaky for a reason it is not testing.
      - name: Packing the same files twice is byte-identical
        run: |
          set -eu
          for run in one two; do
            cargo run --release -q -p mini-cli -- windows pack \
              --source dist/ci/stage --out "dist/repro-$run/client.mnpkg" \
              --version 0.0.1 --built-at-ms 1757635200000 \
              --shortcut 'mininet-desktop.exe=Mininet'
          done
          cmp dist/repro-one/client.mnpkg dist/repro-two/client.mnpkg
          cmp dist/repro-one/client.manifest.txt dist/repro-two/client.manifest.txt

      - name: The manifest's SHA-256 column matches sha256sum
        run: |
          set -eu
          manifest=$(ls dist/ci/mininet-client-*.manifest.txt)
          stage=dist/ci/stage
          grep '^file ' "$manifest" | while read -r _ _ _ sha path; do
            actual=$(sha256sum "$stage/$path" | cut -d' ' -f1)
            if [ "$sha" != "$actual" ]; then
              echo "manifest records $sha for $path but sha256sum says $actual" >&2
              exit 1
            fi
          done

      - name: Install from the embedded payload, verify, upgrade, roll back, remove
        run: |
          set -eu
          setup=$(ls dist/ci/mininet-setup-*)
          root=$(mktemp -d)/Programs
          data=$(mktemp -d)/UserData
          common="--install-root $root --user-data-root $data"
          # An install with no --payload proves the package really is inside
          # the executable, which is the whole point of the single-file build.
          MININET_SETUP_PAYLOAD= "$setup" --silent --json $common
          MININET_SETUP_PAYLOAD= "$setup" --verify --json $common
          mkdir -p "$data" && echo keys > "$data/identity.dpapi"
          # A second, higher version so upgrade and rollback are real.
          cargo run --release -q -p mini-cli -- windows pack \
            --source dist/ci/stage --out dist/ci/next.mnpkg \
            --version 99.0.0 --built-at-ms 1757635200000 \
            --shortcut 'mininet-desktop.exe=Mininet'
          "$setup" --silent --json --payload dist/ci/next.mnpkg $common
          "$setup" --status --json $common | grep -q '"previous_version":"0'
          "$setup" --rollback --json $common
          "$setup" --uninstall --json $common
          test ! -d "$root"
          # Uninstalling never destroys identities unless explicitly told to.
          test -f "$data/identity.dpapi"

      # Two different tampering positions, because they exercise two
      # different refusals: a byte in the payload has to be caught by a file's
      # recorded digest, and a byte in the manifest by the manifest's own
      # self-check. Either way nothing may reach disk.
      - name: A tampered package is refused, wherever it was tampered with
        run: |
          set -eu
          setup=$(ls dist/ci/mininet-setup-*)
          package=$(ls dist/ci/mininet-client-*.mnpkg)
          size=$(wc -c < "$package")

          cp "$package" dist/ci/payload-tampered.mnpkg
          printf '\xff' | dd of=dist/ci/payload-tampered.mnpkg bs=1 \
            seek=$((size - 1)) count=1 conv=notrunc status=none
          root=$(mktemp -d)/Programs
          out=$("$setup" --silent --json --payload dist/ci/payload-tampered.mnpkg \
            --install-root "$root" && echo INSTALLED || true)
          echo "$out" | grep -q '"error_code":"digest_mismatch"'
          # The refused attempt is still recorded in the setup log -- that is
          # what the log is for -- so what must be absent is an *activation*
          # and any half-written staging directory, not the root itself.
          test ! -e "$root/current.txt"
          test -z "$(ls -A "$root/versions" 2>/dev/null || true)"

          cp "$package" dist/ci/manifest-tampered.mnpkg
          printf '\xff' | dd of=dist/ci/manifest-tampered.mnpkg bs=1 \
            seek=64 count=1 conv=notrunc status=none
          root=$(mktemp -d)/Programs
          out=$("$setup" --silent --json --payload dist/ci/manifest-tampered.mnpkg \
            --install-root "$root" && echo INSTALLED || true)
          echo "$out" | grep -q '"ok":false'
          test ! -e "$root/current.txt"

  # SPEC-11's verified-reproducible release check moved to its own workflow
  # (.github/workflows/reproducibility.yml, D-0314): two full clean release
  # builds take 10+ minutes, and gating every PR push -- including
  # docs/research-only PRs that cannot possibly change a build artifact --
  # was slowing down unrelated work without buying any additional
  # assurance. The frozen SPEC-11 requirement itself is untouched: the
  # separate workflow still runs on every push to `main` unconditionally,
  # and on any pull request that touches something other than `docs/**` or
  # markdown.
