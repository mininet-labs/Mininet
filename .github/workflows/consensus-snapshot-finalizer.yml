name: consensus-snapshot-finalizer

on:
  push:
    branches:
      - codex/consensus-snapshot-sync
    paths:
      - .github/workflows/consensus-snapshot-finalizer.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: consensus-snapshot-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/consensus-snapshot-sync
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt
      - name: Apply review fixes and integrate current main
        run: |
          set -euo pipefail
          git config user.name "mininet-consensus-snapshot"
          git config user.email "actions@users.noreply.github.com"

          python3 tools/apply_consensus_snapshot_review_fixes.py

          git rm --ignore-unmatch \
            .github/workflows/consensus-snapshot-stage4.yml \
            .github/workflows/consensus-snapshot-stage5.yml \
            tools/apply_consensus_snapshot_stage4.py \
            tools/apply_consensus_snapshot_review_fixes.py

          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -z "$unresolved" ]; then
              echo "merge failed without unresolved paths"
              exit 1
            fi
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                .github/workflows/ci.yml|Cargo.lock|docs/_generated/*)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                docs/DECISION_LOG.md|docs/STATUS.md)
                  git show ":2:$path" > /tmp/ours
                  git show ":1:$path" > /tmp/base
                  git show ":3:$path" > /tmp/theirs
                  git merge-file --union /tmp/ours /tmp/base /tmp/theirs
                  cp /tmp/ours "$path"
                  git add "$path"
                  ;;
                .github/workflows/consensus-snapshot-finalizer.yml|.github/workflows/consensus-snapshot-stage4.yml|.github/workflows/consensus-snapshot-stage5.yml)
                  git rm --ignore-unmatch "$path"
                  ;;
                *)
                  echo "unexpected merge conflict: $path"
                  exit 1
                  ;;
              esac
            done <<EOF
          $unresolved
          EOF
          fi

          # The permanent PR must use canonical CI, never branch-local writers.
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/consensus-snapshot-finalizer.yml

          cargo generate-lockfile
          cargo fmt --all
          python3 tools/mininet_nav.py build
          git diff --check

      - name: Validate the integrated candidate
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          python3 -m unittest discover -s tools -p 'test_*.py'
          rm -rf /tmp/mininet-canonical
          git worktree add --detach /tmp/mininet-canonical origin/main
          python3 tools/check_governance.py \
            --mode baseline \
            --canonical-root /tmp/mininet-canonical \
            --candidate-activation
          python3 tools/work_claims.py validate
          git worktree remove --force /tmp/mininet-canonical

      - name: Push tested permanent tree
        id: push
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: resolve PR 289 archive and state-sync review findings"
          git push origin HEAD:codex/consensus-snapshot-sync
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record focused validation without granting approval
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.push.outputs.sha }}
        run: |
          gh pr comment 289 --repo mininet-labs/Mininet --body "Review remediation was applied and validated on commit \`${FINAL_SHA}\`: deterministic archive rejections are preflighted before journaling; all record/install consistency checks precede writes; archive files are opened with no-follow semantics; oversized suffixes have a dedicated error; and hostile peer gap/duplicate/reordering cases now exercise the actual state-sync acceptance path. Full workspace format, strict Clippy, tests, governance tests/baseline, work-claim validation, lockfile regeneration, current-main integration, and navigation regeneration passed in the finalizer. The PR remains draft until ordinary exact-head repository, reproducibility, dependency, and Android checks pass. AI evidence carries zero approval weight."
