name: consensus-snapshot-stage1

on:
  push:
    branches:
      - codex/consensus-snapshot-sync
    paths:
      - tools/apply_consensus_snapshot_stage1.py
      - .github/workflows/consensus-snapshot-stage1.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - tools/apply_consensus_snapshot_stage1.py
      - .github/workflows/consensus-snapshot-stage1.yml
      - crates/mini-economy/src/snapshot.rs
      - crates/mini-execution/src/snapshot.rs
      - crates/mini-consensus/src/snapshot.rs
      - crates/mini-consensus/src/state_sync.rs
      - crates/mini-consensus/src/store.rs

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/consensus-snapshot-sync
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Correct stage-one source assumptions before the permanent commit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path("tools/apply_consensus_snapshot_stage1.py")
          text = script.read_text(encoding="utf-8")
          old = '''replace_once(
              "crates/mini-economy/src/lib.rs",
              """mod ledger;
          mod policy;
          mod simulation;
          """,
              """mod ledger;
          mod policy;
          mod simulation;
          mod snapshot;
          """,
          )
          replace_once(
              "crates/mini-economy/src/lib.rs",
              """pub use simulation::{run_scenario, Scenario, ScenarioReport, YearReport};
          """,
              """pub use simulation::{run_scenario, Scenario, ScenarioReport, YearReport};
          pub use snapshot::{
              MonetaryLedgerSnapshot, MAX_SNAPSHOT_BENEFICIARY_BYTES, MAX_VESTING_POSITIONS,
          };
          """,
          )'''
          new = '''replace_once(
              "crates/mini-economy/src/lib.rs",
              """mod ledger;
          """,
              """mod ledger;
          mod snapshot;
          """,
          )
          replace_once(
              "crates/mini-economy/src/lib.rs",
              """pub use ledger::{MonetaryLedger, VestingPosition, VestingSubject};
          """,
              """pub use ledger::{MonetaryLedger, VestingPosition, VestingSubject};
          pub use snapshot::{
              MonetaryLedgerSnapshot, MAX_SNAPSHOT_BENEFICIARY_BYTES, MAX_VESTING_POSITIONS,
          };
          """,
          )'''
          if text.count(old) != 1:
              raise SystemExit("stage-one economy patch target changed")
          text = text.replace(old, new, 1)

          clippy = '''run(
              "cargo",
              "clippy",
              "-p",
              "mini-economy",
              "-p",
              "mini-execution",
              "-p",
              "mini-consensus",
              "--lib",
              "--",
              "-D",
              "warnings",
          )'''
          if text.count(clippy) != 1:
              raise SystemExit("stage-one clippy block changed")
          # Archive installation helpers are deliberately wired by the next
          # stage. The final PR runs strict whole-workspace Clippy after that
          # wiring; stage one proves the codecs and archive behavior first.
          script.write_text(text.replace(clippy, "", 1), encoding="utf-8")

          store = Path("crates/mini-consensus/src/store.rs")
          text = store.read_text(encoding="utf-8")
          old_import = "    use mini_economy::Amount;\n"
          old_state = "        let state = LedgerState::with_genesis_supply(Amount::from_micro(10));\n"
          if text.count(old_import) != 1 or text.count(old_state) != 1:
              raise SystemExit("consensus archive test dependency target changed")
          store.write_text(
              text.replace(old_import, "", 1).replace(
                  old_state,
                  "        let state = LedgerState::new();\n",
                  1,
              ),
              encoding="utf-8",
          )

          snapshot = Path("crates/mini-execution/src/snapshot.rs")
          text = snapshot.read_text(encoding="utf-8")
          old_test = '''    #[test]
              fn tampering_is_rejected() {
                  let mut bytes = populated_state().to_snapshot_bytes().unwrap();
                  let index = DOMAIN.len() + 7;
                  bytes[index] ^= 0x80;
                  assert!(LedgerState::from_snapshot_bytes(&bytes).is_err());
              }
          '''
          new_test = '''    #[test]
              fn unbound_network_mutation_changes_the_state_commitment() {
                  let state = populated_state();
                  let mut bytes = state.to_snapshot_bytes().unwrap();
                  // The execution codec deliberately accepts any 32-byte
                  // network id. Consensus authentication, not an implicit
                  // hard-coded network, binds it to a finalized header.
                  bytes[DOMAIN.len()] ^= 0x80;
                  let mutated = LedgerState::from_snapshot_bytes(&bytes).unwrap();
                  assert_ne!(mutated.network_id(), state.network_id());
                  assert_ne!(mutated.commitment(), state.commitment());
              }

              #[test]
              fn supply_tampering_is_rejected() {
                  let mut bytes = populated_state().to_snapshot_bytes().unwrap();
                  // The final byte is part of unallocated_circulating. Changing
                  // it breaks balances + unallocated == circulating supply.
                  let last = bytes.len() - 1;
                  bytes[last] ^= 1;
                  assert!(LedgerState::from_snapshot_bytes(&bytes).is_err());
              }
          '''
          if text.count(old_test) != 1:
              raise SystemExit("ledger snapshot tamper test changed")
          snapshot.write_text(text.replace(old_test, new_test, 1), encoding="utf-8")
          PY
      - name: Apply and test snapshot/archive stage
        run: python3 tools/apply_consensus_snapshot_stage1.py
      - name: Commit permanent implementation
        if: github.event_name == 'push'
        run: |
          git config user.name "mininet-consensus-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "consensus: add authenticated snapshot and archive foundations"
          git push origin HEAD:codex/consensus-snapshot-sync
