name: consensus-snapshot-stage1

on:
  push:
    branches:
      - codex/consensus-snapshot-sync
    paths:
      - tools/apply_consensus_snapshot_stage1.py
      - .github/workflows/consensus-snapshot-stage1.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - tools/apply_consensus_snapshot_stage1.py
      - .github/workflows/consensus-snapshot-stage1.yml
      - crates/mini-economy/src/snapshot.rs
      - crates/mini-execution/src/snapshot.rs
      - crates/mini-consensus/src/snapshot.rs
      - crates/mini-consensus/src/state_sync.rs
      - crates/mini-consensus/src/store.rs

permissions:
  contents: write

jobs:
  integrate:
    # A pull-request run is visible as exact-head evidence; only the branch-push
    # run is allowed to commit the tested transformation back to the branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/consensus-snapshot-sync
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Correct the one stale mini-economy module-list assumption
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_consensus_snapshot_stage1.py")
          text = path.read_text(encoding="utf-8")
          old = '''replace_once(
              "crates/mini-economy/src/lib.rs",
              """mod ledger;
          mod policy;
          mod simulation;
          """,
              """mod ledger;
          mod policy;
          mod simulation;
          mod snapshot;
          """,
          )
          replace_once(
              "crates/mini-economy/src/lib.rs",
              """pub use simulation::{run_scenario, Scenario, ScenarioReport, YearReport};
          """,
              """pub use simulation::{run_scenario, Scenario, ScenarioReport, YearReport};
          pub use snapshot::{
              MonetaryLedgerSnapshot, MAX_SNAPSHOT_BENEFICIARY_BYTES, MAX_VESTING_POSITIONS,
          };
          """,
          )'''
          new = '''replace_once(
              "crates/mini-economy/src/lib.rs",
              """mod ledger;
          """,
              """mod ledger;
          mod snapshot;
          """,
          )
          replace_once(
              "crates/mini-economy/src/lib.rs",
              """pub use ledger::{MonetaryLedger, VestingPosition, VestingSubject};
          """,
              """pub use ledger::{MonetaryLedger, VestingPosition, VestingSubject};
          pub use snapshot::{
              MonetaryLedgerSnapshot, MAX_SNAPSHOT_BENEFICIARY_BYTES, MAX_VESTING_POSITIONS,
          };
          """,
          )'''
          if text.count(old) != 1:
              raise SystemExit("stage-one economy patch target changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply and test snapshot/archive stage
        run: python3 tools/apply_consensus_snapshot_stage1.py
      - name: Commit permanent implementation
        if: github.event_name == 'push'
        run: |
          git config user.name "mininet-consensus-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "consensus: add authenticated snapshot and archive foundations"
          git push origin HEAD:codex/consensus-snapshot-sync
