name: consensus-snapshot-stage5

on:
  push:
    branches:
      - codex/consensus-snapshot-sync

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: consensus-snapshot-stage5
  cancel-in-progress: false

jobs:
  make-mergeable:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/consensus-snapshot-sync
          fetch-depth: 0
      - name: Wait for stage four to become permanent
        id: readiness
        run: |
          if [ -e tools/apply_consensus_snapshot_stage4.py ] || [ -e .github/workflows/consensus-snapshot-stage4.yml ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Stage four is still present; its permanent commit will retrigger this gate."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.readiness.outputs.ready == 'true'
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt
      - name: Merge latest main and remove this one-shot gate
        if: steps.readiness.outputs.ready == 'true'
        run: |
          git config user.name "mininet-consensus-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/consensus-snapshot-stage5.yml
          python3 tools/generate_repo_navigation.py --write
          git diff --check
      - name: Validate exact integrated tree
        if: steps.readiness.outputs.ready == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          python3 tools/check_governance.py
          python3 tools/check_work_claims.py
          python3 tools/generate_repo_navigation.py --check
      - name: Push clean exact head
        if: steps.readiness.outputs.ready == 'true'
        id: push
        run: |
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "merge: integrate main and finalize D-0207 exact head"
          git push origin HEAD:codex/consensus-snapshot-sync
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for required exact-head workflows
        if: steps.readiness.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.push.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["FINAL_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          required = {
              "ci",
              "governance-policy",
              "reproducibility",
              "android-ci",
              "android-reproducibility",
          }
          deadline = time.time() + 45 * 60
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          while time.time() < deadline:
              url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  runs = json.load(response)["workflow_runs"]

              by_name = {name: [] for name in required}
              for run in runs:
                  name = run.get("name")
                  if name in by_name:
                      by_name[name].append(run)

              present = {name for name, values in by_name.items() if values}
              active = [
                  run
                  for values in by_name.values()
                  for run in values
                  if run.get("status") != "completed"
              ]
              successes = {
                  name
                  for name, values in by_name.items()
                  if any(run.get("status") == "completed" and run.get("conclusion") == "success" for run in values)
              }
              failures = [
                  (name, run.get("html_url"), run.get("conclusion"))
                  for name, values in by_name.items()
                  for run in values
                  if run.get("status") == "completed"
                  and run.get("conclusion") not in {"success", "skipped", "neutral"}
              ]

              if failures:
                  raise SystemExit(f"exact-head workflow failure: {failures}")
              if present == required and not active and successes == required:
                  print(f"all required workflows passed for {sha}")
                  break
              print(
                  f"waiting for {sha}: present={sorted(present)}, "
                  f"success={sorted(successes)}, active={len(active)}"
              )
              time.sleep(20)
          else:
              raise SystemExit(f"timed out waiting for exact-head workflows on {sha}")
          PY
      - name: Truth-sync PR and mark ready
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.push.outputs.sha }}
        run: |
          cat > /tmp/pr-body.md <<EOF
          ## D-0207 — Authenticated snapshots, persistent catch-up, and bounded pruning

          Closes the next major consensus slice in #45 for weak and long-offline devices.

          ### Implemented

          - Canonical, versioned snapshots of the complete deterministic monetary and execution state.
          - Every snapshot binds the exact finalized block header, quorum certificate, state commitment, and settlement-network identifier.
          - Receivers verify the QC with their own static validator set and KEL oracle, recompute the state commitment, and reject wrong-network, forged, non-quorate, stale, gapped, duplicate, conflicting, truncated, oversized, or non-canonical input.
          - Snapshot-aware encrypted state sync returns either a bounded finalized suffix or one authenticated snapshot followed by a bounded suffix.
          - State adoption is all-or-nothing against a cloned chain; a bad later block cannot partially advance live or persistent state.
          - A local filesystem archive provides atomic block/snapshot replacement, locking, symlink refusal, bounded reads and directory growth, crash-replay journals for peer installs, restart recovery, safe pruning, and a bounded compatibility history.
          - Ordinary live commits persist the verified finalized block without rewriting the complete state journal on every height.
          - Response construction is linear in the snapshot plus selected suffix and can return a useful snapshot-only page when the first later block does not fit.
          - Real-TCP tests prove a long-offline node reaches the exact cluster state and reopens from local recovery state.

          ### Authority boundaries

          - No checkpoint operator, hosted snapshot authority, admin key, hardcoded trusted peer, trust-on-first-use rule, or majority-by-download rule.
          - The peer and local archive supply bytes only. Finality remains the locally verified quorum certificate and deterministic state commitment.
          - Balance, storage, bandwidth, service, and snapshot volume confer no validator weight, governance voice, personhood, ownership, or ranking power.
          - No new cryptography and no production/mainnet/real-money activation claim.

          ### Honest limitations

          - Verification is scoped to the repository's current static validator-set model. Historical validator-set transitions, long-range/weak-subjectivity policy, chunked Merkle state transfer, automatic peer discovery/selection/retry, and physical weakest-device benchmarks remain separate work.
          - AI-authored engineering evidence has zero approval weight and is not an external audit.

          ### Exact-head evidence

          Final head: \`${FINAL_SHA}\`

          The exact final head passed repository CI, governance policy, reproducibility, Android CI, Android reproducibility, dependency audit/deny, full formatting, strict Clippy, and the complete workspace test suite before this PR was marked ready.

          Refs #45
          EOF

          jq -n \
            --arg title "Consensus: authenticated snapshots, persistent catch-up, and bounded pruning (D-0207)" \
            --rawfile body /tmp/pr-body.md \
            '{title: $title, body: $body}' > /tmp/pr-update.json
          gh api --method PATCH repos/mininet-labs/Mininet/pulls/289 --input /tmp/pr-update.json
          gh pr ready 289 --repo mininet-labs/Mininet
          gh pr view 289 --repo mininet-labs/Mininet --json isDraft,mergeable,mergeStateStatus,headRefOid,statusCheckRollup
