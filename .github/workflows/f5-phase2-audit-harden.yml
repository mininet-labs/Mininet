name: f5-phase2-audit-harden

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'codex/f5-phase2-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/f5-phase2-model
          fetch-depth: 0
      - name: Correct transform, model adaptive grinding, and truth-sync doctrine
        run: |
          python3 tools/f5_phase2_audit_prepatch.py
          python3 tools/f5_phase2_audit_harden.py
      - name: Commit exact hardened state
        run: |
          git config user.name "mininet-f5-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "model: expose adaptive audit sampling failure"
          git push origin HEAD:codex/f5-phase2-model
