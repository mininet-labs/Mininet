name: f5-phase2-final-soundness

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'codex/f5-phase2-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/f5-phase2-model
          fetch-depth: 0
      - name: Apply final soundness corrections and exact-vector checks
        run: python3 tools/f5_phase2_final_soundness.py
      - name: Commit exact corrected state
        run: |
          git config user.name "mininet-f5-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "model: measure configured bounds and reject stale schemas"
          git push origin HEAD:codex/f5-phase2-model
