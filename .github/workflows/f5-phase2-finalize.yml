name: f5-phase2-finalize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

# One-shot final cleanup. The job removes this workflow, all temporary helpers,
# fixes STATUS, reruns the model tests, and regenerates navigation before push.
jobs:
  finalize:
    if: github.head_ref == 'codex/f5-phase2-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/f5-phase2-model
          fetch-depth: 0
      - name: Clean exact merge candidate and rebuild navigation
        run: python3 tools/f5_phase2_cleanup.py
      - name: Commit exact merge candidate
        run: |
          git config user.name "mininet-f5-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore: finalize F5 Phase-2 merge candidate"
          git push origin HEAD:codex/f5-phase2-model
