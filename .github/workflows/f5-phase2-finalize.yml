name: f5-phase2-finalize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

# One-shot branch-local finalization. Temporary files are removed by the
# connected maintainer after the generated commit lands, so this job never
# needs to push a workflow-file mutation with its GITHUB_TOKEN.
jobs:
  finalize:
    if: github.head_ref == 'codex/f5-phase2-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/f5-phase2-model
          fetch-depth: 0
      - name: Harden model and truth-sync canonical documentation
        run: python3 tools/f5_phase2_finalize.py
      - name: Commit exact generated state
        run: |
          git config user.name "mininet-f5-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "docs: record F5 Phase-2 model status"
          git push origin HEAD:codex/f5-phase2-model
