name: forge-time-index-finalize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'codex/forge-bounded-fs-index-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/forge-bounded-fs-index-pages
          fetch-depth: 0
      - name: Harden ordered index, run adversarial tests, and truth-sync docs
        run: python3 tools/finalize_forge_time_index.py
      - name: Commit exact merge candidate
        run: |
          git config user.name "mininet-index-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "store: harden bounded time pages and record D-0430"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
