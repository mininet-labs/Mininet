name: forge-time-index-input-bounds

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'codex/forge-bounded-fs-index-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/forge-bounded-fs-index-pages
          fetch-depth: 0
      - name: Bound time-index control, metadata, and rebuild inputs
        run: |
          python3 tools/harden_forge_time_index_input_bounds.py
          python3 tools/harden_forge_time_index_rebuild_bounds.py
          python3 tools/fix_forge_memory_page_upper_bound.py
          python3 tools/optimize_forge_time_index_delta_reads.py
      - name: Commit exact hardened state
        run: |
          git config user.name "mininet-index-hardener"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "store: bound time-index control and metadata reads"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
