name: forge-time-index-integrate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'codex/forge-bounded-fs-index-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/forge-bounded-fs-index-pages
          fetch-depth: 0
      - name: Integrate ordered filesystem index and run focused checks
        run: |
          python3 tools/fix_forge_time_index_fixture.py
          python3 tools/fix_forge_time_index_clippy.py
          python3 tools/apply_forge_time_index.py
      - name: Commit integrated implementation
        run: |
          git config user.name "mininet-index-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "store: add bounded filesystem time-index pages"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
