name: forge-time-index-mixed-writers

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  truth-sync:
    if: github.head_ref == 'codex/forge-bounded-fs-index-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/forge-bounded-fs-index-pages
          fetch-depth: 0
      - name: Truth-sync mixed-version and out-of-band writer limitation
        run: python3 tools/document_forge_time_index_mixed_writers.py
      - name: Commit exact truth-synced state
        run: |
          git config user.name "mininet-index-truth-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "docs: record ordered-index mixed-writer boundary"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
