name: forge-time-index-process-test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  process-test:
    if: github.head_ref == 'codex/forge-bounded-fs-index-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/forge-bounded-fs-index-pages
          fetch-depth: 0
      - name: Add and run real cross-process writer coverage
        run: python3 tools/add_forge_time_index_process_test.py
      - name: Commit exact process-tested state
        run: |
          git config user.name "mininet-index-process-test"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: prove cross-process ordered-index writers"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
