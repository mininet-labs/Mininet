name: forge-time-index-review-fixes

on:
  push:
    branches:
      - codex/forge-bounded-fs-index-pages
    paths:
      - tools/apply_forge_time_index_review.py
      - .github/workflows/forge-time-index-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/forge-bounded-fs-index-pages
          fetch-depth: 0
      - name: Apply review fixes and run focused checks
        run: python3 tools/apply_forge_time_index_review.py
      - name: Commit verified permanent state
        run: |
          git config user.name "mininet-time-index-review-fixes"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(store): address ordered-index review findings"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
