name: merge-pr287-after-286

on:
  push:
    branches:
      - codex/forge-bounded-fs-index-pages
    paths:
      - tools/merge_pr287_after_286.py
      - .github/workflows/merge-pr287-after-286.yml

permissions:
  contents: write

concurrency:
  group: pr287-main-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/forge-bounded-fs-index-pages
          fetch-depth: 0
      - name: Configure the integration identity
        run: |
          git config user.name "mininet-pr287-integration"
          git config user.email "actions@users.noreply.github.com"
          rm -f tools/pr287_integration_failure.log
      - name: Merge current main and run focused integration checks
        run: |
          set -o pipefail
          {
            python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/merge_pr287_after_286.py")
          text = path.read_text(encoding="utf-8")

          call = "\napply_exact_head_review_fixes()\n"
          if text.count(call) != 1:
              raise SystemExit("expected one exact-head review-fix call")
          text = text.replace(
              call,
              "\n# Exact-head review fixes are already committed on this branch.\n",
              1,
          )

          old_clippy = '''run(
              "cargo",
              "clippy",
              "--workspace",
              "--all-targets",
              "--all-features",
              "--",
              "-D",
              "warnings",
          )'''
          new_clippy = '''run(
              "cargo",
              "clippy",
              "-p",
              "mini-store",
              "--all-targets",
              "--all-features",
              "--",
              "-D",
              "warnings",
          )'''
          if text.count(old_clippy) != 1:
              raise SystemExit("expected one workspace clippy command")
          text = text.replace(old_clippy, new_clippy, 1)

          old_test = 'run("cargo", "test", "--workspace", "--all-features")'
          new_test = 'run("cargo", "test", "-p", "mini-store", "--all-features")'
          if text.count(old_test) != 1:
              raise SystemExit("expected one workspace test command")
          text = text.replace(old_test, new_test, 1)

          path.write_text(text, encoding="utf-8")
          PY
            python3 tools/merge_pr287_after_286.py
          } 2>&1 | tee /tmp/pr287-integration.log
      - name: Commit combined verified state
        run: |
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "merge: integrate current main after D-0430 review"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
      - name: Preserve bounded diagnostics on failure
        if: failure()
        run: |
          git merge --abort || true
          git reset --hard HEAD
          git clean -fd
          tail -n 600 /tmp/pr287-integration.log > tools/pr287_integration_failure.log
          git add tools/pr287_integration_failure.log
          git commit -m "ci: capture PR 287 integration failure"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
