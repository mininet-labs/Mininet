name: merge-pr287-after-286

on:
  push:
    branches:
      - codex/forge-bounded-fs-index-pages
    paths:
      - tools/merge_pr287_after_286.py
      - .github/workflows/merge-pr287-after-286.yml

permissions:
  contents: write

concurrency:
  group: pr287-main-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/forge-bounded-fs-index-pages
          fetch-depth: 0
      - name: Configure the integration identity
        run: |
          git config user.name "mininet-pr287-integration"
          git config user.email "actions@users.noreply.github.com"
          rm -f tools/pr287_integration_failure.log
      - name: Merge current main, apply review fixes, and run full checks
        run: |
          set -o pipefail
          {
            python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/merge_pr287_after_286.py")
          text = path.read_text(encoding="utf-8")
          old = '''def replace_once_or_already(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one replacement target, found {count}: "
                      f"{old[:160]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '''
          new = '''def replace_once_or_already(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count < 1:
                  raise SystemExit(
                      f"{path}: expected at least one replacement target, found {count}: "
                      f"{old[:160]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '''
          if text.count(old) != 1:
              raise SystemExit("integration helper shape changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
            python3 tools/merge_pr287_after_286.py
          } 2>&1 | tee /tmp/pr287-integration.log
      - name: Commit combined verified state
        run: |
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "merge: integrate current main and review fixes for D-0430"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
      - name: Preserve bounded diagnostics on failure
        if: failure()
        run: |
          git merge --abort || true
          git reset --hard HEAD
          git clean -fd
          tail -n 600 /tmp/pr287-integration.log > tools/pr287_integration_failure.log
          git add tools/pr287_integration_failure.log
          git commit -m "ci: capture PR 287 integration failure"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
