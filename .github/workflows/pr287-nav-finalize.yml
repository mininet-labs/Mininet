name: pr287-nav-finalize

on:
  push:
    branches:
      - codex/forge-bounded-fs-index-pages
    paths:
      - .github/workflows/pr287-nav-finalize.yml

permissions:
  contents: write

concurrency:
  group: pr287-nav-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/forge-bounded-fs-index-pages
          fetch-depth: 0
      - name: Regenerate navigation from the permanent tree
        run: |
          rm .github/workflows/pr287-nav-finalize.yml
          python3 tools/mininet_nav.py build
      - name: Commit exact permanent-tree navigation
        run: |
          git config user.name "mininet-pr287-navigation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "docs: regenerate navigation from permanent D-0430 tree"
          git push origin HEAD:codex/forge-bounded-fs-index-pages
