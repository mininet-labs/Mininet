name: pr292-review-remediation

on:
  push:
    branches:
      - codex/privacy-transport-security

permissions:
  contents: write

concurrency:
  group: pr292-review-remediation
  cancel-in-progress: false

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/privacy-transport-security
          fetch-depth: 0

      - name: Show toolchain
        run: rustup show

      - name: Install workspace test target
        run: rustup target add wasm32-wasip2

      - name: Apply review remediation
        run: python3 tools/apply_pr292_review_fixes.py

      - name: Regenerate repository navigation
        run: python3 tools/mininet_nav.py build

      - name: Format
        run: cargo fmt --all

      - name: Reject whitespace damage
        run: git diff --check

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Complete workspace tests
        run: cargo test --all --all-features

      - name: Remove temporary remediation machinery
        run: |
          rm tools/apply_pr292_review_fixes.py
          rm .github/workflows/pr292-review-remediation.yml

      - name: Commit exact validated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden transport nonce and replay handling"
          git push origin HEAD:codex/privacy-transport-security
