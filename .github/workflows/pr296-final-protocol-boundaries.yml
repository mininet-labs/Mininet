name: pr296-final-protocol-boundaries
# Triggered after the workflow existed in the parent commit.

on:
  push:
    branches: [codex/privacy-transport-runtime-convergence]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr296-final-protocol-boundaries
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.head_ref == '' || github.head_ref == 'codex/privacy-transport-runtime-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/privacy-transport-runtime-convergence
      - name: Apply hardening
        run: |
          python3 tools/patch_pr296_protocol_helper.py
          python3 tools/apply_pr296_final_protocol_boundaries.py
          python3 tools/fix_pr296_profile_and_url_validation.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: |
          cargo clippy -p mini-relay --all-targets --all-features -- -D warnings
          cargo clippy -p mini-transport-security --all-targets --all-features -- -D warnings
          cargo clippy -p mini-search-federation-net --all-targets --all-features -- -D warnings
      - name: Tests
        run: |
          cargo test -p mini-relay --all-features
          cargo test -p mini-transport-security --all-features
          cargo test -p mini-search-federation-net --all-features
      - name: Governance
        run: |
          canonical="$(mktemp -d)"
          rmdir "$canonical"
          git worktree add --detach "$canonical" origin/main
          status=0
          python3 tools/check_governance.py --canonical-root "$canonical" || status=$?
          git worktree remove --force "$canonical"
          exit "$status"
      - name: Clean and regenerate
        run: |
          rm tools/patch_pr296_protocol_helper.py
          rm tools/apply_pr296_final_protocol_boundaries.py
          rm tools/fix_pr296_profile_and_url_validation.py
          rm .github/workflows/pr296-final-protocol-boundaries.yml
          python3 tools/mininet_nav.py build
      - name: Verify cleanup
        run: |
          test ! -e tools/patch_pr296_protocol_helper.py
          test ! -e tools/apply_pr296_final_protocol_boundaries.py
          test ! -e tools/fix_pr296_profile_and_url_validation.py
          test ! -e .github/workflows/pr296-final-protocol-boundaries.yml
          git status --short
      - name: Commit tested tree
        run: |
          git config user.name mininet-runtime-convergence
          git config user.email runtime-convergence@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'fix: seal final protocol boundaries'
          git push origin HEAD:codex/privacy-transport-runtime-convergence
