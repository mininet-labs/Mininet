name: pr296-final-review-hardening
# Triggered after the workflow existed in the parent commit.

on:
  push:
    branches:
      - codex/privacy-transport-runtime-convergence
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr296-final-review-hardening
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.head_ref == '' || github.head_ref == 'codex/privacy-transport-runtime-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/privacy-transport-runtime-convergence

      - name: Apply final review hardening
        run: python3 tools/apply_pr296_final_review_hardening.py

      - name: Format
        run: cargo fmt --all

      - name: Strict focused Clippy
        run: |
          cargo clippy -p mini-relay --all-targets --all-features -- -D warnings
          cargo clippy -p mini-transport-security --all-targets --all-features -- -D warnings
          cargo clippy -p mini-search-federation-net --all-targets --all-features -- -D warnings

      - name: Focused tests
        run: |
          cargo test -p mini-relay --all-features
          cargo test -p mini-transport-security --all-features
          cargo test -p mini-search-federation-net --all-features

      - name: Governance baseline against canonical main
        run: |
          canonical="$(mktemp -d)"
          rmdir "$canonical"
          git worktree add --detach "$canonical" origin/main
          status=0
          python3 tools/check_governance.py --canonical-root "$canonical" || status=$?
          git worktree remove --force "$canonical"
          exit "$status"

      - name: Remove staging machinery and regenerate navigation
        run: |
          rm tools/apply_pr296_final_review_hardening.py
          rm .github/workflows/pr296-final-review-hardening.yml
          python3 tools/mininet_nav.py build

      - name: Verify clean permanent tree
        run: |
          test ! -e tools/apply_pr296_final_review_hardening.py
          test ! -e .github/workflows/pr296-final-review-hardening.yml
          git status --short

      - name: Commit exact tested tree
        run: |
          git config user.name mininet-runtime-convergence
          git config user.email runtime-convergence@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'no resulting change'; exit 1; }
          git commit -m 'fix: close final transport selection and F6 wire-bound review gaps'
          git push origin HEAD:codex/privacy-transport-runtime-convergence
