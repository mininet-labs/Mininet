name: pr296-final-truth-sync
# Triggered after the workflow existed in the parent commit.

on:
  push:
    branches: [codex/privacy-transport-runtime-convergence]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr296-final-truth-sync
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.head_ref == '' || github.head_ref == 'codex/privacy-transport-runtime-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/privacy-transport-runtime-convergence
      - name: Apply honest-limits truth sync
        run: python3 tools/apply_pr296_final_truth_sync.py
      - name: Governance
        run: |
          canonical="$(mktemp -d)"
          rmdir "$canonical"
          git worktree add --detach "$canonical" origin/main
          status=0
          python3 tools/check_governance.py --canonical-root "$canonical" || status=$?
          git worktree remove --force "$canonical"
          exit "$status"
      - name: Regenerate navigation and clean staging
        run: |
          rm tools/apply_pr296_final_truth_sync.py
          rm .github/workflows/pr296-final-truth-sync.yml
          python3 tools/mininet_nav.py build
      - name: Verify cleanup
        run: |
          test ! -e tools/apply_pr296_final_truth_sync.py
          test ! -e .github/workflows/pr296-final-truth-sync.yml
          git status --short
      - name: Commit truth-synced tree
        run: |
          git config user.name mininet-runtime-convergence
          git config user.email runtime-convergence@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'docs: state final privacy limits and real merge gates'
          git push origin HEAD:codex/privacy-transport-runtime-convergence
