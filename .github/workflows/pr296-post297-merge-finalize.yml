name: pr296-post297-merge-finalize

on:
  push:
    branches: [codex/privacy-transport-runtime-convergence]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr296-post297-merge-finalize
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.head_ref == '' || github.head_ref == 'codex/privacy-transport-runtime-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/privacy-transport-runtime-convergence

      - name: Reconcile merged PR 297 truth
        run: python3 tools/apply_pr296_post297_merge.py

      - name: Regenerate combined lockfile
        run: cargo generate-lockfile

      - name: Format
        run: cargo fmt --all

      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Complete workspace tests
        run: cargo test --workspace --all-features

      - name: Dependency policy
        run: cargo deny check

      - name: Remove staging machinery and regenerate navigation
        run: |
          rm tools/apply_pr296_post297_merge.py
          rm .github/workflows/pr296-post297-merge-finalize.yml
          python3 tools/mininet_nav.py build

      - name: Governance against canonical main
        run: |
          canonical="$(mktemp -d)"
          rmdir "$canonical"
          git worktree add --detach "$canonical" origin/main
          status=0
          python3 tools/check_governance.py --canonical-root "$canonical" || status=$?
          git worktree remove --force "$canonical"
          exit "$status"

      - name: Work-claim and permanent-tree validation
        run: |
          python3 tools/work_claims.py validate
          cargo fmt --all -- --check
          git diff --check
          test ! -e tools/apply_pr296_post297_merge.py
          test ! -e .github/workflows/pr296-post297-merge-finalize.yml
          git status --short

      - name: Commit exact tested tree
        run: |
          git config user.name mininet-runtime-convergence
          git config user.email runtime-convergence@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'no resulting change'; exit 1; }
          git commit -m 'chore: reconcile PR 297 and validate PR 296 on current main'
          git push origin HEAD:codex/privacy-transport-runtime-convergence
