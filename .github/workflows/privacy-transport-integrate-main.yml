name: privacy-transport-finalize-push

on:
  push:
    branches:
      - codex/privacy-transport-security

permissions:
  contents: write

concurrency:
  group: privacy-transport-finalize-push
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/privacy-transport-security
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt
      - name: Correct focused evidence counts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_privacy_transport_stage2.py")
          text = path.read_text(encoding="utf-8")
          old = """Focused formatting, 66 unit tests, four
          real-socket tests, and strict Clippy"""
          new = """Focused formatting, 64 unit tests, three
          real-socket tests plus one discovery/session integration test, and strict Clippy"""
          if text.count(old) != 1:
              raise SystemExit("stage-two evidence-count target changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply advertisement-to-session binding and truth sync
        run: python3 tools/apply_privacy_transport_stage2.py
      - name: Format and regenerate navigation
        run: |
          cargo fmt --all
          python3 tools/mininet_nav.py build
      - name: Test focused privacy and relay crates
        run: cargo test -p mini-transport-security -p mini-relay --all-targets --all-features
      - name: Strict Clippy for focused crates
        run: cargo clippy -p mini-transport-security -p mini-relay --all-targets --all-features -- -D warnings
      - name: Commit tested permanent tree without changing workflows
        run: |
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/privacy-transport-integrate-main.yml
          rm -f tools/apply_privacy_transport_stage2.py
          git config user.name "mininet-privacy-transport"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "privacy: bind discovery to sessions and truth-sync D-0377"
          git push origin HEAD:codex/privacy-transport-security
