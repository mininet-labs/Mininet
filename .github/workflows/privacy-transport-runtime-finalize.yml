name: privacy-transport-runtime-finalize

on:
  push:
    branches: [codex/privacy-transport-runtime-convergence]
  pull_request:
    branches: [main]

concurrency:
  group: pr-296-runtime-finalize
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apply-test-and-push:
    if: github.head_ref == '' || github.head_ref == 'codex/privacy-transport-runtime-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: codex/privacy-transport-runtime-convergence

      - name: Show pinned toolchain
        run: rustup show

      - name: Apply constructor sealing and truth sync
        run: python3 tools/apply_runtime_convergence_stage3.py

      - name: Format
        run: cargo fmt --all

      - name: Strict focused Clippy
        run: |
          cargo clippy -p mini-transport-security --all-targets --all-features -- -D warnings
          cargo clippy -p mini-search-federation-net --all-targets --all-features -- -D warnings

      - name: Focused tests
        run: |
          cargo test -p mini-transport-security --all-features
          cargo test -p mini-search-federation-net --all-features
          cargo test -p mini-relay --all-features

      - name: Governance baseline
        run: python3 tools/check_governance.py

      - name: Remove staging machinery and regenerate navigation
        run: |
          rm tools/apply_runtime_convergence_stage3.py
          rm .github/workflows/privacy-transport-runtime-finalize.yml
          python3 tools/mininet_nav.py build

      - name: Verify no staging residue
        run: |
          test ! -e tools/apply_runtime_convergence_stage3.py
          test ! -e .github/workflows/privacy-transport-runtime-finalize.yml
          git status --short

      - name: Commit exact tested tree
        run: |
          git config user.name "mininet-runtime-convergence"
          git config user.email "runtime-convergence@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no resulting change"; exit 1; }
          git commit -m "fix: seal authenticated search provenance and truth-sync runtime convergence"
          git push origin HEAD:codex/privacy-transport-runtime-convergence
