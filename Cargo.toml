    "crates/mini-storage",
    "crates/mini-net",
    "crates/mini-uniqueness",
    "crates/mini-spacetime",
    "crates/mini-treasury",
    "crates/mini-value",
    "crates/mini-private-payment",
    "crates/mini-bounty",
