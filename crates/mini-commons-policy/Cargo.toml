[package]
name = "mini-commons-policy"
version = "0.0.1"
description = "Typed public-commons entitlement policy (PublicCommonsPolicy/Entitlement): protocol rights every identity root holds independently of wallet balance, governance weight, or any paid tier."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# mini-privacy-policy/mini-resource-pricing: the Track C4 paid-service
# boundary (src/boundary.rs) connects this crate's free entitlements to
# the tier/quote vocabulary those crates already define, rather than
# inventing a second pricing model. Neither pulls in mini-value,
# mini-treasury, mini-forge, or mini-chain (both crates' own Cargo.toml
# comments say so), so this stays clear of the voice/value wall. No
# serde, no AEAD -- this crate otherwise remains pure typed policy data
# plus a hand-rolled wire codec.
mini-privacy-policy = { path = "../mini-privacy-policy" }
mini-resource-pricing = { path = "../mini-resource-pricing" }

[dev-dependencies]
# Dev-only: the Track C3 integration test (tests/social_commons.rs) proves
# mini-social's public view/post/comment/reply/react paths actually run to
# completion with no wallet, balance, or payment concept anywhere in the
# call -- these are never a normal-build dependency of this crate.
did-mini = { path = "../did-mini" }
mini-objects = { path = "../mini-objects" }
mini-social = { path = "../mini-social" }
mini-store = { path = "../mini-store" }
