[package]
name = "mini-search-federation-net"
version = "0.0.1"
description = "Bounded, authenticated real-transport delivery of mini-search-federation's F1/F2/F2b signed objects between two Mininet peers (Track F required follow-up: 'wire F1/F2 objects through a bounded real transport with authenticated peer behavior and source-count limits'), plus assembly of a pulled F2 segment + F2b corpus bundle into a real federate_query-ready source. The advertise/pull exchange never sends query terms -- a peer advertises which object ids it holds, nothing more. Track F6 Phase 1 (remote_query/serve_query) is the deliberate, separately-scoped exception: a bounded query string does cross the wire, confidential-in-transit only -- not a private-information-retrieval scheme, see docs/design/f6-private-query-transport.md."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# did-mini for the provider identity a caller expects a session's objects to
# be authored by. mini-objects for Object/ObjectId. mini-store for the local
# Store a pull lands in. mini-bearer for the Bearer/Channel transport this
# crate is generic over (same abstraction mini-sync/mini-relay already use).
# mini-sync supplies the actual trust boundary (KEL-verified provenance,
# bounded exact retrieval) this crate wraps rather than reimplementing.
# mini-search-federation for the F1/F2/F2b object-type constants and
# readers this crate's advertisement filter checks against, and its own
# federate_query/FederationSource that assemble.rs feeds real pulled data
# into. mini-lexical-index/mini-ranker/mini-query/mini-web-types only for
# the IndexSegment/Corpus/DocumentContextTable/IndexSegmentId/
# ProviderPseudonym types assemble.rs rebuilds from a pulled F2b bundle --
# no new indexing/ranking/query logic here, just reassembly. mini-crypto
# for Multihash, reused directly by query.rs's wire codec (RankingProfileId/
# IndexSegmentId/CrawlObservationId are all Multihash-backed) rather than
# introducing a second id representation.
did-mini = { path = "../did-mini" }
mini-objects = { path = "../mini-objects" }
mini-store = { path = "../mini-store" }
mini-bearer = { path = "../mini-bearer" }
mini-sync = { path = "../mini-sync" }
mini-search-federation = { path = "../mini-search-federation" }
mini-lexical-index = { path = "../mini-lexical-index" }
mini-ranker = { path = "../mini-ranker" }
mini-query = { path = "../mini-query" }
mini-web-types = { path = "../mini-web-types" }
mini-crypto = { path = "../mini-crypto" }
mini-transport-security = { path = "../mini-transport-security" }
