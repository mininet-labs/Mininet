[package]
name = "mini-uniqueness"
version = "0.0.1"
description = "Mininet's three-signal personhood/uniqueness fusion (whitepaper SS5): social-vouching graph, physical-presence, and a behavioral-entropy seam pending human-authored ZK design."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
did-mini = { path = "../did-mini" }
mini-presence = { path = "../mini-presence" }
# Real dependency, not test-only, from here on: `object` encodes/decodes an
# attestation's own `IndexedSig`s, matching `mini-social::pairing`'s
# existing wire encoding exactly.
mini-crypto = { path = "../mini-crypto" }
# Publish/resolve a `VouchAttestation` as a real signed, content-addressed
# object so it can be stored and synced, mirroring mini-social's
# `publish_*`/`resolve_*` pattern (`post.rs`'s own module doc explains why:
# a shared, bounded, tested decode path instead of every caller hand-rolling
# one). No governance or value edge: mini-objects/mini-store are leaf data
# types, same as everywhere else they're depended on in this workspace.
mini-objects = { path = "../mini-objects" }
mini-store = { path = "../mini-store" }
