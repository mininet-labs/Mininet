# cargo-deny configuration (D-0069 dependency-governance requirement for
# mini-build-runner-wasmtime, the first crate in this workspace to pull in
# a dependency tree large enough -- Wasmtime plus its own transitive
# graph -- that license/advisory drift stops being something a human can
# eyeball in a `cargo tree` diff). Scoped to the whole workspace, not just
# that one crate, since cargo-deny operates on the resolved dependency
# graph as a whole.
#
# Verified (D-0341, Android beta slice 7, issue #203): `cargo-deny` v0.20.2
# installed and run for real in this environment against the workspace's
# actual `Cargo.lock` -- the "not available in the sandbox this file was
# authored in" gap below is closed. `cargo deny check` now runs clean
# against this file; every allowance below is a specific, reasoned
# response to a real finding, not a guess.

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # No safe upgrade exists (advisory's own "Solution" field). Reachable
    # only through mini-desktop's font-rendering stack (egui's default
    # bundled fonts): ab_glyph -> owned_ttf_parser -> ttf-parser. Not a
    # protocol/identity/value crate; re-evaluate if a maintained
    # alternative (the advisory suggests `skrifa`) becomes a drop-in
    # replacement for ab_glyph's dependency, or if ttf-parser gains a
    # maintainer.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no safe upgrade available; font-rendering-only reachability via mini-desktop's egui stack" },
    # RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (the two quick-xml DoS
    # advisories, reachable only through wayland-scanner's build-time XML
    # parsing) were ignored here with a "revisit when mini-desktop's GUI
    # stack is next upgraded" note. That upgrade has happened on its own:
    # wayland-scanner 0.31.11 resolves quick-xml to 0.41.0, which is the
    # fixed version, so cargo-deny now reports both ignores as
    # `advisory-not-detected`. Removed rather than left in place -- a
    # stale ignore is a standing claim that this tree knowingly carries a
    # vulnerability it no longer has, and it would silently absorb the
    # advisory if a future dependency change reintroduced an old
    # quick-xml.
    #
    # D-0507 (Gate #93 remediation, `mini-custody` over `frost_ristretto255`):
    # atomic-polyfill 1.0.3 <- heapless 0.7.17 <- postcard 1.1.3 <-
    # frost-core 3.0.0 <- frost-ristretto255/frost-rerandomized 3.0.0 <-
    # mini-custody. `frost-ristretto255` is pinned to the exact version the
    # Gate #93 audit report's normative profile names (Section 5); its
    # `serialization` feature (needed for `PublicKeyPackage::serialize`,
    # used at `mini_custody::session` to persist the ceremony's completion
    # attestation) pulls `postcard`, whose default `heapless-cas` feature
    # brings in `heapless` 0.7's compare-and-swap polyfill for targets
    # without native atomics -- that is the only path to atomic-polyfill in
    # this graph. No safe upgrade exists (the advisory's own "Solution"
    # field): `heapless` 0.8+ replaced atomic-polyfill with
    # `portable-atomic`, but `postcard` 1.1.3 (latest) still pins `heapless`
    # 0.7, which this workspace does not control. A maintenance-status
    # advisory (not a CVE) in a compile-time atomics compatibility shim,
    # not code on any network-reachable path. Revisit when `postcard`
    # upgrades its `heapless` dependency, or if `frost-core` gains a way to
    # serialize without `postcard`.
    { id = "RUSTSEC-2023-0089", reason = "unmaintained, no safe upgrade available; reachable only through frost-ristretto255's postcard/heapless serialization feature (mini-custody, D-0507)" },
    # clear_on_drop 0.2.5 <- bulletproofs 5.0.0 <- mini-value (D-0036/D-0040
    # Bulletproofs range proofs; also reached via mini-bounty,
    # mini-private-payment, mini-shielded-verify). No safe upgrade exists
    # (the advisory's own "Solution" field): bulletproofs 5.0.0 is the
    # version this workspace vendors and pins, and it has not moved off
    # clear_on_drop for its own internal zeroing. The advisory's suggested
    # replacement (the `zeroize` crate) is exactly what mini-crypto already
    # uses at every boundary this workspace controls; clear_on_drop here is
    # internal to bulletproofs' own implementation, not a call site this
    # tree makes directly. Revisit when bulletproofs releases a version off
    # clear_on_drop, or if mini-value's Bulletproofs dependency is replaced.
    { id = "RUSTSEC-2026-0283", reason = "unmaintained, no safe upgrade available; internal to vendored bulletproofs 5.0.0's own zeroing, not a direct call site (mini-value)" },
]

[licenses]
version = 2
# Every license actually in use across this workspace's dependency graph
# at the time of writing (mini-crypto/did-mini's curve25519-dalek stack,
# mini-value's Bulletproofs machinery, and now Wasmtime's own tree via
# mini-build-runner-wasmtime). CC0-1.0 is this workspace's own license
# (see root Cargo.toml `[workspace.package]`).
allow = [
    "MIT",
    # UniFFI is the accepted D-0020 mobile binding layer. MPL-2.0's
    # file-level copyleft does not change Mininet's own CC0-1.0 sources.
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # OSI-approved/FSF-free, permissive; used by clipboard-win/error-code
    # (arboard -> egui-winit -> eframe -> mini-desktop's clipboard support).
    "BSL-1.0",
    # SIL Open Font License 1.1: the standard free-font license (also used
    # by e.g. Google's Noto fonts). Bundled font data only, in
    # epaint_default_fonts (egui's default fonts, mini-desktop).
    "OFL-1.1",
    # Ubuntu Font Licence 1.0: same reachability as OFL-1.1 above
    # (epaint_default_fonts bundles both a fallback OFL font and the
    # Ubuntu font). Free/redistributable font data, not code.
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# `deny` would also flag every intra-workspace `path = "../other-crate"`
# dependency in this repo, because a path dependency with no `version`
# requirement is indistinguishable from a real `*` wildcard to cargo-deny
# -- and every one of this workspace's ~45 crates depends on several
# others that way. That is not the risk `wildcards` exists to catch (an
# external crate resolvable to any past-or-future registry version); a
# path dependency always resolves to the exact source at this exact git
# commit. Genuine external wildcard requirements (a real supply-chain
# risk) still surface here as warnings and should be caught in review.
wildcards = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
