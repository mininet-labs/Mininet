# Mininet Node Appliance — journal retention, set for privacy first.
#
# Installed to /etc/systemd/journald.conf.d/ so it layers over Debian's
# defaults without replacing the operator's own journald.conf.
#
# # Why an appliance ships a log policy at all
#
# `mini sync listen` accepts connections from peers. Systemd's journal
# records, by default, a great deal about a service's lifetime, and a
# connection log is a record of **who talked to this node and when**. On a
# network built so that observers learn as little as possible, an
# indefinitely-retained local log of every peer contact is a
# deanonymization corpus sitting on disk, waiting for whoever eventually
# gets access to the machine — a thief, a border search, a subpoena, a
# resold hard drive.
#
# The founder's standing direction on this class of trade-off is that
# privacy comes first. So this profile keeps logs small and short-lived by
# default. An operator who is actively debugging can raise these values
# deliberately; the point is that the *default* does not quietly accumulate
# a peer-contact history nobody asked for.
#
# This bounds what the journal keeps. It cannot bound what an application
# chooses to print, and it is not anonymity: anyone with root on this
# machine while it runs sees everything regardless. Network-level privacy
# is mini-relay's and mini-transport-security's job, not journald's.

[Journal]
# Persist across reboots (a node that forgets every crash cannot be
# debugged at all) but keep the window short.
Storage=persistent

# Hard ceilings, sized for the cheap hardware this profile targets rather
# than for a server with a spare terabyte.
SystemMaxUse=200M
SystemMaxFileSize=20M
RuntimeMaxUse=50M

# The retention decision. Two weeks is long enough to investigate a fault
# somebody noticed last weekend, and short enough that a seized disk does
# not yield months of peer-contact timing.
MaxRetentionSec=2week
MaxFileSec=1day

# Do not forward to syslog or the console: forwarding copies the same
# records into a second store with its own, unbounded retention, which
# silently defeats every limit above.
ForwardToSyslog=no
ForwardToWall=no

# Drop debug-level records entirely. Debug logging on a networked service
# is where peer addresses and payload detail leak into the journal.
# Raise this only while actively debugging, and lower it again afterward.
MaxLevelStore=info
