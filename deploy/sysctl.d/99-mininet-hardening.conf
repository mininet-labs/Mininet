# Mininet Node Appliance — minimal kernel-hardening baseline (Day 0).
#
# This is deliberately narrow: generic, well-known sysctl hardening that
# applies to any internet-facing peer-to-peer node, not a Mininet-specific
# security boundary. It does not replace nftables (deploy/nftables/), does
# not attempt SELinux/AppArmor-equivalent mandatory access control, and
# does not claim to harden the kernel beyond these settings — see
# docs/design/mininet-node-appliance.md's "Honest non-claims".
#
# Applied via: sysctl --system (reads /etc/sysctl.d/*.conf)

# --- network: reject spoofed/source-routed traffic ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# --- network: ignore ICMP redirects (this node is never a router) ---
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# --- network: log and drop martian packets ---
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# --- network: SYN flood resistance for the sync listener ---
net.ipv4.tcp_syncookies = 1

# --- kernel: reduce information leakage to unprivileged processes ---
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.yama.ptrace_scope = 1

# --- kernel: disable unprivileged user namespaces if unused elsewhere ---
# Left commented: mini-build-runner-wasmtime's sandbox model has not been
# audited against this restriction yet. Do not enable until confirmed.
# kernel.unprivileged_userns_clone = 0
