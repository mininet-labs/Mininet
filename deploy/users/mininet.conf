# Mininet Node Appliance — declarative system user/group (Day 0).
#
# systemd-sysusers format (see sysusers.d(5)). Applied via:
#   systemd-sysusers /etc/sysusers.d/mininet.conf
#
# Creates a dedicated, unprivileged system account. Mininet's own binary
# and state never run as root: the appliance installer builds/installs
# `mini` as root (package/file installation is inherently privileged) but
# every unit in deploy/systemd/ runs as this user.
#
# Type name     ID   GECOS                       home              shell
u  mininet      -    "Mininet node service account" /var/lib/mininet  /usr/sbin/nologin
